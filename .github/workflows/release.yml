name: Release

on:
  push:
    tags:
      - "v*"
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 statt 24.04: baut gegen aeltere glibc/WebKit, laeuft dadurch auch auf
          # neueren Systemen. Andersherum nicht.
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libgtk-layer-shell-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # Muss vor `cargo test` laufen: `tauri::generate_context!` bricht ab, wenn das in
      # `frontendDist` konfigurierte `../dist` nicht existiert.
      - name: Build frontend
        run: npm run build

      # Kompiliert lib- und bin-Target mit und faengt damit einen kaputten Linux-Build
      # bereits im PR ab, nicht erst beim Release.
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Nur dieser Schritt ist tag-exklusiv — er baut die Installer und legt den Release an.
      - uses: tauri-apps/tauri-action@v0
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Fliq ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
