[package]
name = "desktop-flipclock"
version = "2.0.0"
description = "Fliq, a desktop flip clock"
authors = ["Dav1d-Fn"]
edition = "2021"

[lib]
name = "desktop_flipclock_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18" }
wayland-client = "0.31"
# Same major as wry uses; needed to reload the page after a web process crash.
webkit2gtk = "2.0"

